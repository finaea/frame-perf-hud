name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting!
        Logs may contain IP addresses on your home network. Feel free to replace them with `x.x.x.x`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead (a screenshot helps).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the bar at the top of the Frame Perf HUD tab in the SteamVR dashboard, or run `~/.local/bin/frame-perf-hud --version` on the Frame.
      placeholder: "0.4.3"
    validations:
      required: true
  - type: dropdown
    id: item
    attributes:
      label: What looks wrong
      multiple: true
      options:
        - Frame rate (fps) or reprojection
        - GPU or CPU
        - Temperature
        - Power or fan
        - Battery (headset or controllers)
        - Steam Link or Wi-Fi
        - Clock
        - HUD position, facing or wrist mode
        - Settings tab
        - Updates
        - Not about a value
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run these on the Frame (Desktop Mode terminal or ssh) soon after the problem, and paste the output.
        `journalctl --user -u frame-perf-hud --since "1 hour ago" --no-pager`
        `~/.local/bin/frame-perf-hud --debug-dump`
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Your settings if you changed any (`~/.config/frame-perf-hud/config.json`), what was running at the time, etc.
